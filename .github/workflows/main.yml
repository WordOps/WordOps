
name: CI

on:
  push:
    branches:
      - updating-configuration
      - master
      - ci
      - feature/ubuntu-26.04-support
  pull_request:
    branches:
      - master
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  my_job:
    name: test WordOps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare VM
        run: |
          unset LANG
          sudo apt-get update -qq
          sudo rm -rf /etc/mysql /var/lib/mysql
          sudo apt-get purge --option=Dpkg::options::=--force-all --assume-yes 'graphviz*' 'redis*' 'php*' 'mysql*' 'nginx*' > /dev/null 2>&1 || true
          sudo apt-get install -qq git ccze tree apt-transport-https curl
          sudo apt-get -qq autoremove --purge > /dev/null 2>&1
          sudo git config --system user.name "WordOps CI"
          sudo git config --system user.email "root@localhost.com"

      - name: Install WordOps
        run: sudo timeout 1800 bash install --travis

      - name: Run tests
        run: sudo timeout 1800 bash tests/travis.sh --actions

      - name: Display log
        if: always()
        run: |
          if [ -f /var/log/wo/test.log ]; then
            sudo cat /var/log/wo/test.log | ccze -A
          fi
